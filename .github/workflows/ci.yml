name: Offline quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install exact locked dependencies (no AI models)
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install -r apps/api/requirements.lock
          exit $LASTEXITCODE
      - name: Local quality gates
        shell: pwsh
        env:
          PVL_DISABLE_CLOUD: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PVL_OLLAMA_ENABLED: '0'
        run: ./scripts/check.ps1
      - name: Dependency advisory and installed requirement checks
        shell: pwsh
        run: |
          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip check
          exit $LASTEXITCODE
      - name: Browser integration and actual API smoke
        shell: pwsh
        env:
          PVL_E2E_FIXTURE: '1'
          PVL_DISABLE_CLOUD: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PVL_OLLAMA_ENABLED: '0'
        run: |
          npx playwright install msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:e2e
          exit $LASTEXITCODE
      - name: Frozen visual candidate regression (recorded NOT E5, no API/cloud/model)
        shell: pwsh
        env:
          PVL_E2E_FIXTURE: '1'
          PVL_VISUAL_STAGE: verify
          PVL_VISUAL_REPLAY: '1'
        run: npm run test:visual
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-browser-evidence
          path: |
            docs/evidence/d08/review-r1/regression/fixture-search-example.json
            docs/evidence/d08/review-r1/regression/fixture-rag-example.json
            docs/evidence/d08/review-r1/regression/fixture-guided-example.json
            test-results/
