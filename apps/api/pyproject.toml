[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../tests"]
pythonpath = ["."]
addopts = "-ra -m 'not real_tokenizer'"
markers = ["real_tokenizer: separate integration check using explicitly cached E5 assets"]
